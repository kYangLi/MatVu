[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "matvu"
dynamic = ["version"]
description = "Automatic viewpoint optimization and visualization for materials structures."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "kYangLi", email = "lyang.1915@gmail.com" }]
keywords = [
    "materials",
    "visualization",
    "structure",
    "crystal",
    "viewpoint",
    "rendering",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pillow>=9.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4",
]

[project.urls]
Repository = "https://github.com/kYangLi/MatVu"
Issues = "https://github.com/kYangLi/MatVu/issues"
Changelog = "https://github.com/kYangLi/MatVu/blob/main/CHANGELOG.md"

[project.scripts]
matvu = "matvu.cli:main"

[tool.hatch.version]
path = "src/matvu/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/matvu"]

[tool.hatch.build.targets.sdist]
# keep the source distribution lean: image assets live in the repository only
exclude = [
  "docs/_image",
  "docs/_image/**",
  "examples/figures",
  "examples/figures/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
